# Portão de qualidade: roda em todo PR e push na main.
# Preparado para quando o site virar repositório no GitHub (ainda não existe). Não publica nada.
name: qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint:html
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'
